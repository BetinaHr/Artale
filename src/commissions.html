<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поръчки</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Styles -->
    <link href="../styles/reset.css" rel="stylesheet">
    <link href="../styles/style.css" rel="stylesheet">
    <link href="../styles/commissions.css" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top border-bottom">
            <div class="container">

                <!-- Лого -->
                <a class="navbar-brand d-flex align-items-center" href="../index.html">
                    <img src="./assets/images/Artale.png" alt="Artale logo" width="50" height="50">
                    <span class="artale-brand">Artale</span>
                </a>

                <!-- Phone button -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Меню -->
                <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Начало</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="./catalog.html">Каталог</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="./aboutUs.html">За нас</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="./contacts.html">Контакт</a>
                        </li>

                    </ul>
                </div>

                <!-- Бутон вдясно -->
                <a href="./commissions.html" class="purchase-btn">
                    Направи поръчка
                </a>

            </div>
        </nav>
    </header>

    <main>
        <section class="commission-caption">
            <h1>Поръчай своята книга</h1>
            <p>Сподели визията си и ние ще създадем персонализиран шедьовър.</p>
        </section>

        <!-- Reusable message box -->
        <div class="site-message" id="siteMessage"></div>

        <form class="commission-form" data-form-type="commission" novalidate>

            <div class="card">
                <h2>Вашата информация</h2>

                <div class="form-row">
                    <input 
                        type="text" 
                        name="fullName" 
                        placeholder="Име и фамилия" 
                        required
                    >

                    <input 
                        type="email" 
                        name="email" 
                        placeholder="Имейл" 
                        required
                    >
                </div>
            </div>

            <div class="card">
                <h2>Избор на книга</h2>

                <div class="form-row">
                    <input 
                        type="text" 
                        name="bookTitle" 
                        placeholder="Заглавие на книга" 
                        required
                    >

                    <input 
                        type="text" 
                        name="author" 
                        placeholder="Автор" 
                        required
                    >
                </div>
            </div>

            <div class="card">
                <h2>Персонализация</h2>

                <div class="form-row">
                    <select name="coverMaterial" required>
                        <option value="">Материал на корицата</option>
                        <option value="Кожа">Кожа</option>
                        <option value="Твърда">Твърда</option>
                        <option value="Мека">Мека</option>
                    </select>

                    <input 
                        type="text" 
                        name="coverColor" 
                        placeholder="Цвят на корицата"
                    >
                </div>
            </div>

            <div class="card">
                <h2>Гравиране</h2>

                <input 
                    type="text" 
                    name="engraving" 
                    placeholder="Инициали или кратък текст"
                >
            </div>

            <div class="card">
                <h2>Допълнителни бележки</h2>

                <textarea 
                    id="message"
                    name="message" 
                    placeholder="Сподели мислите си тук..."
                ></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Изпрати поръчката
            </button>

        </form>
    </main>

    <div class="footer-basic">
        <footer>
            <div class="social">
                <a href="https://www.instagram.com/artale_books/" aria-label="Instagram"><img src="./assets/images/instagram-circle.png" alt="Instagram account" style="opacity: 0.90;"></a>
                <a href="https://www.tiktok.com/@artale_books" aria-label="TikTok"><img src="./assets/images/tiktok-circle.png" alt="TikTok account" style="opacity: 0.90;"></a>
                <a href="https://www.pinterest.com/artale_books/" aria-label="Pinterest"><img src="./assets/images/pinterest.png" alt="Pinterest account" style="opacity: 0.90;"></a>
                    <!-- <a href="#" aria-label="Facebook"></a> -->
            </div>

            <ul class="list-inline">
                <li class="list-inline-item"><a href="../index.html">Начало</a></li>
                <li class="list-inline-item"><a href="./catalog.html">Каталог</a></li>
                <li class="list-inline-item"><a href="./aboutUs.html">За нас</a></li>
                <li class="list-inline-item"><a href="./contacts.html">Контакт</a></li>
            </ul>

            <p class="copyright">Artale © 2026</p>
        </footer>
    </div>
    <!-- Scripts -->
    <script src="./assets/js/page-transition.js"></script>
    <script src="./assets/js/form-validation.js"></script>
    <script src="./assets/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
