<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/styles/reset.css" rel="stylesheet" />
    <link href="/styles/style.css" rel="stylesheet" />
    <link href="/styles/commissions.css" rel="stylesheet" />

    <title>Commissions</title>
</head>
<body>
    <header>
        <nav>
            <div class="nav-content">
                <img src="./assets/images/Artale.png" alt="brand-logo" style="width: 50px; height: 50px;">
                <li><a href="/index.html">Начало</a></li>
                <li><a href="./catalog.html">Каталог</a></li>
                <li><a href="commissions.html">Поръчки</a></li>
                <li class="nav-right"><a href="./aboutUs.html">За нас</a></li>
                <li class="nav-right"><a href="./contacts.html">Контакти</a></li>
            </div>
        </nav>
    </header>

    <main>
        <section class="commission-caption">
            <h1>Поръчай своята книга</h1>
            <p>Сподели визията си и ние ще създадем персонализиран шедьовър.</p>
        </section>

        <form class="commission-form">

            <div class="card">
                <h2>Вашата информация</h2>

                <div class="form-row">
                    <input type="text" placeholder="Име и фамилия" required>
                    <input type="email" placeholder="Имейл" required>
                </div>
            </div>

            <div class="card">
                <h2>Избор на книга</h2>

                <div class="form-row">
                    <input type="text" placeholder="Заглавие на книга">
                    <input type="text" placeholder="Автор">
                </div>
            </div>

            <div class="card">
                <h2>Персонализация</h2>

                <div class="form-row">
                    <select>
                        <option>Материал на корицата</option>
                        <option>Кожа</option>
                        <option>Твърда</option>
                        <option>Мека</option>
                    </select>

                    <input type="text" placeholder="Цвят на корицата">
                </div>
            </div>

            <div class="card">
                <h2>Гравиране</h2>
                <input type="text" placeholder="Инициали или кратък текст">
            </div>

            <div class="card">
                <h2>Допълнителни бележки</h2>
                <textarea placeholder="Опиши какво си представяш..."></textarea>
            </div>

            <button class="submit-btn">Изпрати поръчката</button>

        </form>
    </main>

</body>
</html>
