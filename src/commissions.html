</head>

<body>
    <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top border-bottom">
        <div class="container">

        <!-- Лого -->
        <a class="navbar-brand d-flex align-items-center" href="../index.html">
            <img src="./assets/images/Artale.png" alt="logo" width="50" height="50">

            Artale
            </span>
        </a>

        <!-- Бутон за mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Меню -->
        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav">

            <li class="nav-item">
                <a class="nav-link" href="../index.html">Начало</a>

            <li class="nav-item">
                <a class="nav-link" href="./catalog.html">Каталог</a>

        <a href="commissions.html" class="purchase-btn">
            Направи поръчка

        </div>

    </header>


    <main>
        <section class="commission-caption">
            <h1>Поръчай своята книга</h1>
            <p>Сподели визията си и ние ще създадем персонализиран шедьовър.</p>
        </section>

        <form class="commission-form">

            <div class="card">
                <h2>Вашата информация</h2>

                <div class="form-row">
                    <input type="text" placeholder="Име и фамилия" required>
                    <input type="email" placeholder="Имейл" required>
                </div>
            </div>

            <div class="card">
                <h2>Избор на книга</h2>

                <div class="form-row">
                    <input type="text" placeholder="Заглавие на книга">
                    <input type="text" placeholder="Автор">
                </div>
            </div>

            <div class="card">
                <h2>Персонализация</h2>

                <div class="form-row">
                    <select>
                        <option>Материал на корицата</option>
                        <option>Кожа</option>
                        <option>Твърда</option>
                        <option>Мека</option>
                    </select>

                    <input type="text" placeholder="Цвят на корицата">
                </div>
            </div>

            <div class="card">
                <h2>Гравиране</h2>
                <input type="text" placeholder="Инициали или кратък текст">
            </div>

            <div class="card">
                <h2>Допълнителни бележки</h2>
                <textarea id="myText" placeholder="Сподели мислите си тук..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Изпрати поръчката</button>

        </form>
    </main>
    <script src="../src/assets/js/script.js"></script>
    <script src="../src/assets/js/catalog.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
